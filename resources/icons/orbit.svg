<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan to Blue Electric Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#11151c" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Main Circle Body -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#orbitGrad)" stroke-width="24" filter="url(#glow)"/>

  <!-- Orbiting Swoosh Ring -->
  <ellipse cx="256" cy="256" rx="195" ry="85" fill="none" stroke="url(#orbitGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" transform="rotate(-35 256 256)"/>

  <!-- Minimalist Code Bracket Angle (<) inside Core -->
  <path d="M 275 195 L 195 256 L 275 317" fill="none" stroke="url(#orbitGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
