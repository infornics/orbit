<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0072ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0040aa" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#005bea"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Core Radial Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)"/>

  <!-- Orbital Ring (Tilted Ellipse) -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="url(#ringGrad1)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" transform="rotate(-32 256 256)"/>

  <!-- Orbital Satellite Node -->
  <circle cx="390" cy="170" r="14" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="390" cy="170" r="6" fill="#ffffff"/>

  <!-- Central Planet Core -->
  <circle cx="256" cy="256" r="68" fill="#121824" stroke="url(#ringGrad1)" stroke-width="6"/>

  <!-- Code Brackets & Slash in Core -->
  <path d="M 232 242 L 218 256 L 232 270 M 280 242 L 294 256 L 280 270 M 264 238 L 248 274" fill="none" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
